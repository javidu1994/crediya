
services:

  #################################
  # PostgreSQL
  #################################
  db:
    image: postgres:16
    container_name: crediya-db #Es lo mismo que el HOST
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-db:/var/lib/postgresql/data
    env_file:
      - .env

    networks:
      - crediya-network

  #################################
  # PgAdmin
  #################################
  pgadmin:
    depends_on:
      - db
    image: dpage/pgadmin4:7.8
    ports:
      - "9000:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
    env_file:
      - .env

    networks:
      - crediya-network


  #################################
  # Microservicio Autenticación
  #################################

  crediya-ms-autenticacion:

    build:
      context: ./crediya-ms-autenticacion
      target: ${STAGE}
      dockerfile: deployment/Dockerfile

    container_name: crediya-ms-autenticacion
    ports:
      - ${AUTH_PORT}:${AUTH_PORT} # Debe estar en el .env raiz al ser validado por compose y no por el micro
#    environment:
#      STAGE: ${STAGE}
#      DB_HOST: ${DB_HOST}
#      DB_PORT: ${DB_PORT}
#      DB_USERNAME: ${DB_USERNAME}
#      DB_PASSWORD: ${DB_PASSWORD}
#      DB_NAME: ${DB_NAME}
#      APP_PORT: ${APP_PORT}
    env_file:
      - ./crediya-ms-autenticacion/.env # Permite leer todas las variables del micro sin necesidad de definirlas aqui

    networks:
      - crediya-network


  #################################
  # Microservicio Solicitudes
  #################################

  crediya-ms-solicitudes:

    build:
      context: ./crediya-ms-solicitudes
      target: ${STAGE}
      dockerfile: deployment/Dockerfile

    container_name: crediya-ms-solicitudes
    ports:
      - ${SOLICITUDES_PORT}:${SOLICITUDES_PORT}
#    environment:
#      STAGE: ${STAGE}
#      DB_HOST: ${DB_HOST}
#      DB_PORT: ${DB_PORT}
#      DB_USERNAME: ${DB_USERNAME}
#      DB_PASSWORD: ${DB_PASSWORD}
#      DB_NAME: ${DB_NAME}
#      APP_PORT: ${APP_PORT}
    env_file:
      - ./crediya-ms-solicitudes/.env

    networks:
      - crediya-network


networks:
  crediya-network:
    external: true

volumes:
  postgres-db:
    external: false
  pgadmin:
    external: false